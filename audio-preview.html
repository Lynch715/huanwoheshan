<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乐与声 · 还我河山</title>
<style>
  :root { color-scheme: light; --ink: #292c26; --light: #676659; --red: #8e3128; --rule: #c8b896; --paper: #f7f1e3; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: #e4dac4; font: 16px/1.6 "Songti SC", "Noto Serif CJK SC", SimSun, serif; }
  main { width: min(920px, calc(100% - 36px)); margin: clamp(18px, 5vw, 64px) auto; background: var(--paper);
    border: 1px solid var(--rule); padding: clamp(18px, 5vw, 52px); box-shadow: 0 8px 32px #332b1617; }
  header { padding-bottom: 20px; border-bottom: 3px double var(--rule); }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(30px, 6vw, 54px); line-height: 1.25; letter-spacing: .15em; }
  h2 { font-size: 21px; letter-spacing: .06em; margin-bottom: 12px; }
  header p { margin-top: 10px; color: var(--light); }
  section { margin-top: 25px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 16px; }
  .controls label { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .controls output { min-width: 4ch; text-align: right; }
  input { accent-color: var(--red); width: clamp(76px, 24vw, 150px); }
  button { font: inherit; min-height: 44px; padding: 8px 12px; color: var(--ink); border: 1px solid var(--rule);
    background: #fdf8ec; border-radius: 3px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  button[aria-pressed="true"] { color: #fff7ea; background: var(--red); border-color: var(--red); }
  button:disabled { opacity: .55; cursor: default; }
  @media (hover: hover) { button:not(:disabled,[aria-pressed="true"]):hover { border-color: var(--red); color: var(--red); } }
  .tones { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; }
  .moods { display: grid; grid-template-columns: repeat(auto-fit, minmax(144px, 1fr)); gap: 8px; }
  .moods button { text-align: left; }
  .moods small { display: block; opacity: .8; }
  #status { min-height: 1.6em; margin-top: 8px; color: var(--light); }
</style>
</head>
<body>
<main>
  <header>
    <h1>乐与声</h1>
    <p>还我河山 · 合成音色试听</p>
    <div class="controls">
      <button type="button" id="stop">停止播放</button>
      <label>总音量 <input id="volume" type="range" min="0" max="100" value="80"><output for="volume">80%</output></label>
    </div>
    <p id="status" role="status">轻点下方曲调、音色或音效即可试听。</p>
  </header>
  <section aria-labelledby="music-title">
    <h2 id="music-title">音乐</h2>
    <div class="moods" id="moods"></div>
  </section>
  <section aria-labelledby="tones-title">
    <h2 id="tones-title">音色</h2>
    <div class="tones" id="tones"></div>
  </section>
  <section aria-labelledby="effects-title">
    <h2 id="effects-title">音效</h2>
    <div class="tones" id="effects"></div>
  </section>
</main>
<script src="js/audio.js?v=0.20.0"></script>
<script>
  AUDIO.init({ persist: false, buttonSounds: false });
  const status = document.querySelector('#status');
  const supported = AUDIO.supported();
  const descriptions = { title: '标题 · 古琴独奏', peace: '古琴与箫', war: '低弦与战鼓', crisis: '磬声与低鼓' };
  let request = 0;
  function buttons(target, names, play, music = false) {
    for (const [id, name] of Object.entries(names)) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = name;
      button.disabled = !supported;
      if (music) {
        const detail = document.createElement('small');
        detail.textContent = descriptions[id];
        button.append(detail);
        button.setAttribute('aria-pressed', 'false');
      }
      button.addEventListener('click', async () => {
        const action = ++request;
        const ready = await AUDIO.unlock();
        if (action !== request) return;
        if (!ready) { status.textContent = '声音暂不可用，请再轻点一次。'; return; }
        play(id);
        if (music) {
          for (const other of target.children) other.setAttribute('aria-pressed', String(other === button));
        }
        status.textContent = (music ? '正在播放' : '正在试听') + '「' + name + '」。';
      });
      target.append(button);
    }
  }
  buttons(document.querySelector('#moods'), AUDIO.moods, AUDIO.setMusic, true);
  buttons(document.querySelector('#tones'), AUDIO.instruments, AUDIO.audition);
  buttons(document.querySelector('#effects'), AUDIO.cueNames, AUDIO.play);
  document.querySelector('#stop').addEventListener('click', () => {
    request++;
    AUDIO.stop();
    for (const button of document.querySelectorAll('#moods button')) button.setAttribute('aria-pressed', 'false');
    status.textContent = '已停止播放。';
  });
  document.querySelector('#volume').addEventListener('input', e => {
    AUDIO.setSetting('master', e.target.valueAsNumber / 100);
    e.target.nextElementSibling.value = e.target.value + '%';
  });
  if (!supported) status.textContent = '此浏览器不支持 Web Audio，无法试听。';
</script>
</body>
</html>
